<!doctype html>
<html lang="zh-Hant" data-mood="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2f35">
<title>斷在學校｜3D 互動簡報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
:root{
  --paper:#2b2f35;--ink:#eef0f2;--text2:#c3c8cf;--muted:#8d949d;--line:rgba(220,228,236,.13);
  --accent:#f2a65a;--accent-soft:rgba(242,166,90,.15);--accent2:#9fb4c9;--warn:#e8735a;--warn-soft:rgba(232,115,90,.14);
  --card:rgba(30,33,38,.74);--card-border:rgba(255,255,255,.1);--glass:rgba(34,38,44,.72);--on-accent:#2a1a08;
  --mono:'DM Mono',Consolas,ui-monospace,monospace;--serif:'Noto Serif TC','PMingLiU','Noto Sans TC',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',Arial,sans-serif;
  --gutter:clamp(18px,4.6vw,72px);--ease:cubic-bezier(.65,0,.2,1);--spring:cubic-bezier(.2,.9,.25,1.12);
}
/* 明亮：學校重新被點亮之後 */
html[data-mood="bright"]{
  --paper:#e9f0f4;--ink:#2a2420;--text2:#51473f;--muted:#8a7d70;--line:rgba(80,55,30,.13);
  --accent:#d96a1f;--accent-soft:rgba(217,106,31,.12);--accent2:#3f8f6b;--warn:#c4472f;--warn-soft:rgba(196,71,47,.1);
  --card:rgba(255,252,246,.84);--card-border:rgba(120,80,40,.14);--glass:rgba(255,252,246,.8);--on-accent:#fff;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background 1.2s,color 1.2s}
button{font:inherit;color:inherit}
a{color:var(--accent)}

#world{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}
/* 底片顆粒與暗角：灰暗時明顯，明亮時淡去 */
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.9;transition:opacity 1.6s;background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.42) 100%)}
html[data-mood="bright"] .grain{opacity:.25}

/* ---------- 載入畫面 ---------- */
.loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#2b2f35;color:#eef0f2;transition:opacity .9s var(--ease),visibility .9s}
.loader.done{opacity:0;visibility:hidden}
.loader-inner{text-align:center}
.loader b{display:block;font:900 clamp(30px,4.4vw,48px) var(--serif);letter-spacing:.02em}
.loader b em{font-style:normal;color:#f2a65a}
.loader-bar{width:min(260px,60vw);height:2px;margin:22px auto 10px;background:rgba(255,255,255,.12);overflow:hidden;border-radius:2px}
.loader-bar i{display:block;height:100%;width:0;background:#f2a65a;transition:width .3s}
.loader small{font:11px var(--mono);letter-spacing:.14em;color:#8d949d}
.load-error{display:none;max-width:520px;margin:18px auto 0;padding:12px 16px;background:rgba(242,166,90,.1);color:#ffd9a8;border:1px solid rgba(242,166,90,.4);border-radius:10px;font-size:13px;line-height:1.7;text-align:left}
.load-error.show{display:block}

/* ---------- 頂部列 ---------- */
.topbar{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 16px);left:var(--gutter);right:var(--gutter);display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.brand{font:11px var(--mono);letter-spacing:.18em;color:var(--muted);display:flex;align-items:center;gap:10px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:pulse 2.4s ease-in-out infinite}
.tools{display:flex;gap:8px;pointer-events:auto}
.tool{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);font:11px var(--mono);letter-spacing:.08em;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .25s,border-color .25s}
.tool:hover{border-color:var(--accent);background:var(--accent-soft)}
.tool kbd{font:10px var(--mono);padding:1px 5px;border-radius:4px;background:var(--line)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.counter{font:12px var(--mono);letter-spacing:.12em;padding:0 4px;display:flex;align-items:center}
.counter b{font-weight:500;color:var(--ink)}
.counter span{color:var(--muted)}

/* ---------- 資訊卡 ---------- */
.card{
  position:fixed;z-index:10;width:var(--w);left:var(--l);top:var(--t);
  transform:translate(0,var(--ty));
  max-height:calc(100svh - 150px);overflow:auto;scrollbar-width:none;
  padding:clamp(20px,2.4vw,34px);border-radius:22px;
  background:var(--card);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  border:1px solid var(--card-border);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.55);
  transition:left 1s var(--ease),top 1s var(--ease),width 1s var(--ease),transform 1s var(--ease),opacity .45s,filter .45s,background 1.2s,border-color 1.2s;
}
.card::-webkit-scrollbar{display:none}
.card[data-layout="left"]{--w:min(480px,38vw);--l:var(--gutter);--t:50%;--ty:-50%}
.card[data-layout="right"]{--w:min(480px,38vw);--l:calc(100vw - var(--gutter) - var(--w));--t:50%;--ty:-50%}
.card[data-layout="hero"]{--w:min(620px,48vw);--l:var(--gutter);--t:52%;--ty:-50%}
.card[data-layout="bottom"]{--w:min(1080px,calc(100vw - 2 * var(--gutter)));--l:calc(50vw - var(--w) / 2);--t:calc(100svh - 74px);--ty:-100%}
.card.leaving{opacity:0;filter:blur(8px)}
.card::before{content:"";position:absolute;left:0;top:28px;width:3px;height:42px;border-radius:0 3px 3px 0;background:var(--accent)}

.eyebrow{font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px}
.eyebrow .num{display:inline-grid;place-items:center;min-width:28px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.card{color:var(--ink)}
.title{color:var(--ink);font:900 clamp(32px,3.6vw,54px)/1.16 var(--serif);letter-spacing:-.01em;margin:16px 0 14px}
.card[data-layout="hero"] .title{font-size:clamp(56px,7.4vw,112px);margin:18px 0 14px}
.title em{font-style:normal;color:var(--accent)}
.title .ln{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.title .ln>span{display:inline-block}
.dek{font-size:clamp(14px,1.15vw,16.5px);line-height:1.9;color:var(--text2);margin:0}
.card[data-layout="hero"] .dek{font-size:clamp(17px,1.5vw,21px);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{font:11px var(--mono);letter-spacing:.06em;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--accent-soft);color:var(--ink)}
.facts{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:2px;counter-reset:f}
.facts li{counter-increment:f;display:grid;grid-template-columns:30px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.75;color:var(--text2)}
.facts li::before{content:counter(f,decimal-leading-zero);font:11px var(--mono);color:var(--accent);padding-top:3px}
.facts b{color:var(--ink)}
.facts.plain li{grid-template-columns:1fr}
.facts.plain li::before{display:none}
.hint{display:flex;align-items:center;gap:10px;margin-top:22px;font:11px var(--mono);letter-spacing:.12em;color:var(--muted)}
.hint i{width:28px;height:1px;background:var(--accent);animation:nudge 1.4s ease-in-out infinite alternate}
.sources{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-size:11px;line-height:1.6;color:var(--muted)}
.sources::before{content:"資料來源";font:10px var(--mono);letter-spacing:.12em;color:var(--muted);width:100%}
.sources a{text-decoration:none;border-bottom:1px solid var(--accent-soft)}

/* 分組（逐步出現的段落） */
.grp{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--line)}
.grp .k{font:10px var(--mono);letter-spacing:.14em;color:var(--accent)}
.grp h4{margin:5px 0 6px;font-size:17px;letter-spacing:-.01em;color:var(--ink)}
.grp p{margin:0;font-size:13.5px;line-height:1.8;color:var(--text2)}
.grp .facts{margin-top:8px}
.grp .facts li{font-size:13px;padding:8px 0}
.grp.row{margin-top:6px;padding:9px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0}
.grp.row .k{grid-row:span 2;font-size:11px;color:var(--accent)}
.grp.row h4{margin:0;font-size:15px}
.grp.row p{font-size:12.5px;line-height:1.7}
.grp.row.last{background:var(--warn-soft);border-radius:10px;border-top-color:transparent}
.grp.row.last .k,.grp.row.last h4{color:var(--warn)}
.pips{display:flex;gap:5px;margin-top:2px}
.pips i{width:22px;height:4px;border-radius:4px;background:var(--line)}
.pips i.on{background:var(--accent)}
.quote{margin:16px 0 0;padding:4px 0 4px 18px;border-left:3px solid var(--accent);font:600 clamp(17px,1.5vw,21px)/1.7 var(--serif);color:var(--ink)}

/* 大數字 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{padding:14px 12px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--line)}
.stat b{font:500 clamp(24px,2.3vw,34px)/1 var(--mono);letter-spacing:-.04em;color:var(--ink)}
.stat small{font:12px var(--mono);color:var(--muted);margin-left:2px}
.stat span{display:block;margin-top:8px;font-size:11.5px;line-height:1.5;color:var(--text2)}
.stat.warn{background:var(--warn-soft)}
.stat.warn b{color:var(--warn)}

/* 進場動畫：.anim 元素依 --i 依序出現 */
.anim{opacity:0;transform:translateY(16px)}
.card.in .anim{animation:rise .8s var(--spring) forwards;animation-delay:calc(var(--i,0) * 70ms + 120ms)}
.title .ln>span{transform:translateY(105%)}
.card.in .title .ln>span{animation:lineUp .9s var(--ease) forwards;animation-delay:calc(var(--i,0) * 90ms + 80ms)}
.part[hidden]{display:none!important}
.part.reveal .anim,.part.reveal.anim{animation:rise .7s var(--spring) both;animation-delay:calc(var(--i,0) * 70ms)}

/* ---------- 指引線、標籤 ---------- */
#leader{position:fixed;inset:0;z-index:8;pointer-events:none;width:100%;height:100%;opacity:0;transition:opacity .5s}
#leader.show{opacity:1}
#leader path{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 5;animation:dash 1.2s linear infinite}
#leader .dot{fill:var(--accent)}
#leader .ring{fill:none;stroke:var(--accent);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
.tag{position:fixed;z-index:9;left:0;top:0;pointer-events:none;padding:5px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:11px var(--sans);font-weight:700;letter-spacing:.06em;white-space:nowrap;opacity:0;transition:opacity .4s}
.tag.show{opacity:1}

/* ---------- 進度軌 ---------- */
.rail{position:fixed;z-index:20;left:var(--gutter);right:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;gap:6px;align-items:flex-end}
.seg{flex:1;height:22px;border:0;padding:0;background:none;cursor:pointer;position:relative}
.seg::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:var(--line);transition:background .3s,height .3s}
.seg i{position:absolute;left:0;bottom:0;height:3px;border-radius:3px;background:var(--accent);width:0;transition:width .7s var(--ease)}
.seg.done i{width:100%}
.seg:hover::before{height:5px}
.seg span{position:absolute;left:0;bottom:12px;font:10px var(--sans);letter-spacing:.06em;white-space:nowrap;color:var(--muted);opacity:0;transform:translateY(4px);transition:.25s}
.seg:hover span,.seg.active span{opacity:1;transform:none}
.seg.active span{color:var(--ink)}
.navbtns{display:flex;gap:6px;margin-left:12px}
.navbtns button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--glass);cursor:pointer;font-size:15px;transition:.2s}
.navbtns button:hover{background:var(--accent);color:var(--on-accent)}

/* ---------- 講稿面板 ---------- */
.notes{position:fixed;z-index:30;right:12px;top:60px;bottom:64px;width:min(420px,calc(100vw - 24px));padding:22px 24px;border-radius:18px;background:rgba(24,26,30,.95);border:1px solid rgba(255,255,255,.1);color:#e9ece8;backdrop-filter:blur(12px);transform:translateX(calc(100% + 24px));transition:transform .6s var(--ease);display:flex;flex-direction:column;gap:12px}
.notes.open{transform:none}
.notes header{display:flex;justify-content:space-between;align-items:baseline;font:11px var(--mono);letter-spacing:.12em;color:#b7a48f}
.notes h3{margin:0;font-size:20px;letter-spacing:-.02em}
.notes .body{flex:1;overflow:auto;font-size:15px;line-height:2;color:#dde2e8;white-space:pre-line;padding-right:6px}
.notes .body:empty::before{content:"（尚未提供講稿）";color:#7d848c}
.notes footer{font:11px var(--mono);color:#8b929b;border-top:1px solid #33373d;padding-top:10px;display:flex;justify-content:space-between;gap:10px}
.notes .timer{color:#f2a65a}

@keyframes rise{to{opacity:1;transform:none}}
@keyframes lineUp{to{transform:none}}
@keyframes nudge{to{transform:translateX(8px);opacity:.5}}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
@keyframes dash{to{stroke-dashoffset:-18}}
@keyframes ring{from{r:6;opacity:1}to{r:22;opacity:0}}

@media (max-width:820px){
  .card,.card[data-layout]{--w:calc(100vw - 2 * var(--gutter));--l:var(--gutter);--t:calc(100svh - 70px);--ty:-100%;max-height:52svh;padding:20px}
  .card[data-layout] .title{font-size:clamp(28px,8vw,40px)}
  .stats{grid-template-columns:1fr 1fr}
  .tool .lbl{display:none}
  .seg span{display:none}
  .navbtns{display:none}
}
html.still *,html.still *::before,html.still *::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
</style>
<script src="../vendor/three.bundle.min.js"></script>
<script src="assets/models/斷在學校.glb.js"></script>
</head>

<script type="module">
const THREE=window.THREE;
const {GLTFLoader,RoomEnvironment,EffectComposer,RenderPass,UnrealBloomPass,OutputPass,ShaderPass}=window.THREE_ADDONS;

/* =====================================================================
   簡報內容：每一頁的文字與步驟
   steps：每按一次「下一步」進入下一個 step；parts 決定顯示哪些區塊
   mood：0 = 灰暗、1 = 明亮（可為每一步各給一個值）
   focus / tag：指引線指向的物件或角色（可寫在 step 內）
   ===================================================================== */
const SLIDES = [
{ id:'cover', label:'開場', eyebrow:'GUIDANCE · DROPOUT PREVENTION', mood:0,
  title:'斷在<em>學校</em>',
  dek:'從輔導觀點看中途離校與輟學',
  chips:['2026 年 10 月 27 日','@xuzhi'], hint:true,
  steps:[{layout:'hero',parts:['dek','chips']}],
  notes:`各位老師、同學好，我今天報告的主題是「斷在學校：從輔導觀點看中途離校與輟學」。

大家看到的這個畫面是灰色的，還下著雨。左邊是一個家，中間是學校，右邊是街頭。站在校門口的這個孩子，等一下會帶我們走完整個故事。

我想先請大家記住一個問題：一個孩子離開學校，到底是從哪裡開始斷掉的？又可以在哪裡把它接回來？` },

{ id:'news', label:'小樂的故事', eyebrow:'一則新聞', mood:0,
  title:'小樂不是<br><em>突然不見</em>的',
  dek:'小樂的離校，從家裡開始，在學校長大，最後在街頭成形。（國教署表揚中輟輔導時所舉案例，聯合報 2015）',
  groups:[
    {k:'01 · 家庭',h:'家庭是起始',p:'父母離異，祖母與父親先後過世，連住的房子都被法拍——安全感一層層剝落。'},
    {k:'02 · 學校',h:'學校是發展',p:'絕望變成對同學的言語霸凌、對師長的頂撞；關係破裂，最後離開教室。'},
    {k:'03 · 社會',h:'社會是後果',p:'中輟期間四處遊蕩、流連網咖，直到縣府安排他到中介學園住宿就讀，才重新找到方向。'}],
  quote:'在小樂「霸凌、頂撞」的那段日子裡，有沒有人看見行為背後那個正在失去一切的孩子？如果有，故事能不能在學校就轉彎？',
  steps:[{layout:'left',parts:['dek']},
         {layout:'left',parts:['dek','g0'],focus:'破舊房屋',tag:'家：起點'},
         {layout:'left',parts:['dek','g0','g1'],focus:'小樂',tag:'小樂'},
         {layout:'left',parts:['dek','g0','g1','g2'],focus:'網咖',tag:'網咖'},
         {layout:'left',parts:['quote']}],
  sources:['聯合報〈10年少一半 國中小中輟生創新低〉，2015'],
  notes:`先從一則新聞開始。教育部在表揚中輟輔導有功單位時，國教署舉了一位化名「小樂」的學生為例。這是 2015 年聯合報的報導。

小樂的離校，從家裡開始，在學校長大，最後在街頭成形。

（下一步）

第一段是家庭。小樂從小經歷父母離異，祖母和父親又先後過世，最後連住的房子都被法拍。大家看門口那塊「法拍」的牌子：他的安全感，就是這樣一層一層被剝掉的。

（下一步）

第二段是學校。小樂背起書包走進國中，可是這份絕望沒有消失，而是變成對同學的言語霸凌、對師長的頂撞。關係一段一段破裂，最後他離開了教室。

（下一步）

第三段是社會。中輟期間，他四處遊蕩、流連網咖，直到縣府社會處安排他到中介學園住宿就讀，才重新找到方向。

（下一步）

把這三段拉遠來看，是一條很清楚的路徑：家庭是起始，學校是發展，社會是後果。

身為輔導人員，我們要問的是：在小樂霸凌、頂撞的那段日子裡，有沒有人看見行為背後那個正在失去一切的孩子？如果有，故事能不能在學校就轉彎？` },

{ id:'now', label:'現況', eyebrow:'現況 · 113 學年（2024–25）', mood:0,
  title:'回來的孩子，<br>有<em>一半</em>會再離開',
  dek:'把孩子找回來只是一半的工作，讓他「留下來」才是輔導真正的戰場。',
  stats:[{n:'2,104',u:'人',l:'國中小中輟人數（113 學年）；國中 1,694、國小 410'},
         {n:'89.8',u:'%',l:'總復學率（113 學年）：找回來的機制已相當成熟'},
         {n:'49.28',u:'%',l:'總再輟率（113 學年）：近半再度離開',warn:true}],
  facts:['<b>高中職中途離校（2025 報導）：</b>每年約 2 萬人，比例是國中小的五倍以上，且無強迫入學保護',
         '<b>離校後長期待在家（2025 報導）：</b>54.61%——後果不只是犯罪，還有繭居與社會退縮'],
  groups:[{k:'WHY · 教育部分析（2015）',h:'中輟原因',p:'過半為個人因素（以作息不正常為主），其次是家庭因素（父母管教不當最多），再其次是社會因素（不良同儕）。「作息不正常」很少是孩子單獨造成的，它往往是家庭照顧功能鬆動後，最先在學校顯現的症狀。'}],
  steps:[{layout:'left',parts:['dek','stats']},{layout:'left',parts:['dek','facts']},{layout:'left',parts:['g0']}],
  sources:['教育部中輟統計（衛福部兒少統計轉載）','姊妹淘〈台灣高中職離校潮飆升〉，2025','聯合報，2015'],
  notes:`小樂不是特例。先看 113 學年的數字。

全國國中小中輟生有 2,104 人，其中國中 1,694 人，大約占八成。總復學率是 89.8%，表示「把孩子找回來」的機制已經相當成熟。

但右邊這個紅色的數字是 49.28%，這是總再輟率。畫面上這群孩子走回校門，但其中一半又轉身離開了。也就是說，把孩子找回來只是一半的工作，讓他「留下來」，才是輔導真正的戰場。

（下一步）

到了高中職，問題更大。根據 2025 年的報導，高中職每年中途離校大約 2 萬人，比例是國中小的五倍以上，而且沒有強迫入學的保護。

離校之後，有 54.61% 長期待在家裡。所以後果不只是犯罪，還有繭居與社會退縮。

（下一步）

那孩子為什麼離開？教育部在 2015 年的分析中，過半歸為個人因素，以「生活作息不正常」為主；其次是家庭因素，以父母管教不當最多；再其次是社會因素，也就是受到不良同儕影響。

但從輔導的角度來看，「作息不正常」很少是孩子單獨造成的。它往往是家庭照顧功能鬆動之後，最先在學校顯現出來的症狀。` },

{ id:'family', label:'家庭', eyebrow:'起點 · 家庭', mood:0, focus:'破舊房屋', tag:'孩子帶來上學的家',
  title:'家庭是<em>起始</em>',
  dek:'孩子的書包裡，裝著一整個家。學校無法替孩子換一個家，但必須看懂孩子帶著什麼樣的家來上學。',
  facts:['<b>照顧缺位：</b>父母離異、失親、隔代教養或長期在外工作——早上沒人叫起床，晚上沒人問功課',
         '<b>管教失衡：</b>過度嚴厲、完全放任或標準不一致——學不會規律，也學不會信任大人',
         '<b>經濟與居住不穩：</b>頻繁搬家、打工貼補家用、住所被迫遷移——上學不再是最優先',
         '<b>關係衝突：</b>親子溝通斷線、家中長期爭吵——只好往外找歸屬'],
  quote:'這些不是孩子的錯，而是他的基本需求沒被滿足。學校裡那位穩定的大人，可能是他生命中第一個「不會離開」的人。',
  steps:[{layout:'left',parts:['dek']},{layout:'left',parts:['dek','facts'],focus:'法拍告示',tag:'法拍告示'},{layout:'left',parts:['quote']}],
  sources:['許舜賢〈青少年中途輟學相關因素之探討〉'],
  notes:`所以我們回到故事的起點：家庭。

孩子的書包裡，裝著一整個家。學校沒辦法替孩子換一個家，但必須看懂孩子帶著什麼樣的家來上學。

（下一步）

常見的家庭起點有四種樣貌。

第一是照顧缺位：父母離異、失親、隔代教養，或是父母長期在外工作。孩子早上沒人叫他起床，晚上也沒人問他功課。

第二是管教失衡：過度嚴厲、完全放任，或是父母的標準不一致。孩子學不會規律，也學不會信任大人。

第三是經濟與居住不穩：頻繁搬家、需要打工貼補家用、住所被迫遷移。對這樣的孩子來說，上學不是最優先的事。

第四是關係衝突：親子溝通斷線、家裡長期爭吵。孩子在家感受不到被理解，只好往外找歸屬。

研究也指出，家庭因素中最關鍵的，就是親子關係衝突與管教問題。

（下一步）

從輔導的眼光看，這些都不是孩子的錯，而是他的基本需求沒有被滿足。當安全感、被照顧、被看見都匱乏的時候，「準時到校、專心上課」對他來說是一個太高的要求。

家庭給了起點，但起點不是終點。對很多孩子來說，學校裡那位穩定的大人，可能是他生命中第一個「不會離開」的人。` },

         {layout:'left',parts:['quote']}],
  sources:['許舜賢〈青少年中途輟學相關因素之探討〉','姊妹淘，2025'],
  notes:`家庭給了起點，但讓問題「長大」的，常常是學校裡一連串沒被接住的挫折。學校因素中最關鍵的，是孩子缺少成功經驗，所以對學校生活失去興趣。

一個孩子從教室滑向校門外，通常會經過五個階段。請大家看小樂的位置。

（下一步）

第一，學業挫敗。跟不上進度，從「我不會」變成「我不要」，再變成「反正我就是爛」。你看他坐在位子上，頭已經低下去了。

（下一步）

第二，人際疏離。在班上沒有朋友，被排擠或被霸凌。同學們聚在一起，他一個人走到角落，開始轉向校外的同儕、其他中輟生去找歸屬。

（下一步）

第三，師生衝突與標籤化。頂撞、違規、上課睡覺，於是被貼上「問題學生」的標籤。老師走過來，但懲處多於理解，孩子也開始用壞行為去證明這個標籤。

（下一步）

第四，缺曠課累積。遲到、請假、只上半天課，最後整天不見人。他一步一步靠近校門，而每一次缺席，都讓回來變得更難。

（下一步）

第五，正式離校。國中小只要連續三天沒到校，就會列入中輟通報；高中職則多半以休學、退學或「志趣不合」收場。

高中職離校者有將近一半填寫「志趣不合」，但背後常藏著升學壓力、與父母失聯、在校遭歧視或霸凌，以及對未來失去希望。

（下一步）

所以輔導觀點的核心是：行為是訊息，不是結論。小樂在學校的霸凌與頂撞，正是家裡崩解之後發出的求救訊號。

每一次曠課，都是孩子在投票：這裡沒有我的位置。學校的任務，就是在他投下最後一票之前，讓他找到位置。` },

  sources:['鄭崇趁〈中輟學生的輔導與中介教育方案〉','監察院〈國中(小)中輟生〉調查報告','姊妹淘，2025','臺中市主計處，2023'],
  notes:`孩子一旦離開學校，就同時失去了每天有大人看著他的地方。後果大致往兩個方向發展。

（下一步）

第一個方向是向外，被校外的誘惑接走。

早年教育部委託的調查發現，中輟學生的犯罪率大約是一般學生的三到五倍。監察院也曾調查 2009 年新竹南寮的案件：一名青年遭五名 15 到 18 歲的少年圍毆致死。報告指出，在多起震驚社會的青少年犯罪中，嫌犯幾乎都是中輟或未就學的孩子。

而且，高中職的中離生不像國中小，有強迫入學和警政協尋。學校只能勸說，沒辦法強制復學。這張保護網，在孩子 15 歲之後幾乎就消失了。

沒在學校被接住的孩子，會在社會的某個角落等著被接住，或者被利用。` },

  notes:`所以，斷點必須設在學校。

家庭很難在短期內改變，社會後果的代價又最高，而學校是唯一每天都看得見孩子的地方。家庭埋下起點，問題在學校發展；五道防線的目標，就是在它走進社會之前把它攔下來。

大家注意看，接下來每多一道防線，這個世界就會亮一點。

（下一步）

第一道防線：早期辨識，讓導師成為第一道雷達。

孩子當天沒到校、又聯繫不上，就列入預警，不要等到第三天。同時建立高關懷學生名單，像是家庭變故、學業低落、人際孤立、頻繁請假的孩子，由導師、學務、教務和輔導室共同追蹤。

還要特別留意「安靜的孩子」。繭居型的離校者往往不鬧事，只是慢慢消失。

（下一步）

第二道防線：發展性與介入性輔導，給孩子一個不會離開的大人。

每一位高關懷學生，都配一位固定的認輔老師，重點是關係，不是說教。再搭配個別諮商與小團體，練習情緒調節、人際技巧，重建自我價值。

還有親師合作與家訪：目的是把家庭拉回來，而不是把責任推回去；必要時，再連結親職教育與家庭教育中心。

（下一步）

第三道防線：處遇性輔導，跨網絡把孩子接住。

大家看，社工、警察和老師一起走進校門，圍在孩子身邊。這代表結合學生輔導諮商中心、社工的脆弱家庭服務、警政協尋與少年輔導單位，一起召開個案會議。

如果正規課程已經接不住，還有中介教育：中途班、合作式中途班、慈輝班或住宿型學園，提供替代性的教育，讓學習不會完全中斷。

（下一步）

第四道防線：多元展能，讓孩子在學校贏一次。

透過技藝教育、彈性課程、社團與服務學習，為不擅長紙筆考試的孩子創造成功經驗。

像屏東的飛夢林學園，讓原本中輟、家庭失能的國中生學習技能，有學生在國中畢業前就考取中餐丙級證照，之後升上餐旅高中。

（下一步）

第五道防線：復學不是結案，讓回來的孩子留下來。

  }

  // 五道防線特效
  const D=s.id==='defense';
  const tch=actors['認輔老師']?.o.position;
  radar.forEach((r,i)=>{const on=D&&st===1&&k>.6;const u=((t*.45+i/3)%1);r.position.set(tch.x,.12,tch.z);r.scale.setScalar(1+u*7);r.material.opacity=on?(1-u)*.7:0;r.visible=on});
  const netOn=(D&&st===3)||s.id==='closing';
  netRing.position.set(s.id==='closing'?0:SP.ring[0],.12,s.id==='closing'?2.2:SP.ring[1]);
  netRing.material.opacity+=((netOn?.75:0)-netRing.material.opacity)*.06;netRing.visible=netRing.material.opacity>.01;netRing.scale.setScalar(1+Math.sin(t*2)*.03);
  stallRing.position.set(8,.12,3.2);stallRing.material.opacity+=((D&&st===4?.8:0)-stallRing.material.opacity)*.06;stallRing.visible=stallRing.material.opacity>.01;stallRing.scale.setScalar(1+Math.sin(t*3)*.05);
  flows.net?.forEach(f=>f.update(t,D&&st===3));

  // 指引線與標籤（鏡頭到位後才出現）
  const stp=s.steps[st], focus=stp.focus??s.focus, ftag=stp.tag??s.tag;
  const fa=focus&&actors[focus];
  if(focus&&k>.92&&!isNarrow()&&(!fa||fa.vis>.5)){
    const sp=project(P(focus)),r=card.getBoundingClientRect();
    if(sp.ok&&sp.x>0&&sp.x<innerWidth&&sp.y>0&&sp.y<innerHeight){
      const leftSide=sp.x>r.right, ax=leftSide?r.right:r.left, ay=THREE.MathUtils.clamp(sp.y,r.top+40,r.bottom-40);
      const cx=(ax+sp.x)/2;
      leaderPath.setAttribute('d',`M${ax},${ay} C${cx},${ay} ${cx},${sp.y} ${sp.x},${sp.y}`);
      leaderDot.setAttribute('cx',sp.x);leaderDot.setAttribute('cy',sp.y);leaderRing.setAttribute('cx',sp.x);leaderRing.setAttribute('cy',sp.y);
      leader.classList.add('show');
      tag.textContent=ftag;tag.style.transform=`translate(${sp.x+(leftSide?18:-18-tag.offsetWidth)}px,${sp.y-44}px)`;tag.classList.add('show');
    }else{leader.classList.remove('show');tag.classList.remove('show')}
  }else{leader.classList.remove('show');tag.classList.remove('show')}

  composer.render();
}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);if(ready)cam.off=offsetFor(SLIDES[slideIdx].steps[stepIdx].layout)});

/* 啟動：支援網址 #頁碼.步驟 */
const [hashSlide,hashStep]=location.hash.slice(1).split('.');
const startAt=Math.max(0,Math.min(SLIDES.length-1,(parseInt(hashSlide)||1)-1));
go(startAt,(parseInt(hashStep)||1)-1,true);
mood=moodTarget();
camera.position.set(30,22,46);cam.tgt.set(-2,3,2);
frame();
</script>
